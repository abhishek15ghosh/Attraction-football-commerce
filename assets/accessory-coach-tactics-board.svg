<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-hidden="true">

  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272b30"/>
      <stop offset=".48" stop-color="#090b0e"/>
      <stop offset="1" stop-color="#010203"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
