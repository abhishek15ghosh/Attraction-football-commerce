  <g filter="url(#shadow)">
    <ellipse cx="278" cy="260" rx="128" ry="124" fill="#f2f4ee" stroke="#c5cbc5" stroke-width="7"/>
    <ellipse cx="278" cy="260" rx="58" ry="55" fill="#0f1316" stroke="#cfff20" stroke-width="7"/>
    <path d="M408 187c71-17 139 31 154 100 15 70-31 138-102 153-71 14-136-31-151-100-15-70 28-136 99-153Z" fill="url(#black)" stroke="#555d60" stroke-width="7"/>
    <ellipse cx="436" cy="313" rx="47" ry="45" fill="#0c0f12" stroke="#d1a12b" stroke-width="7"/>
    <path d="M170 381c111-21 216-17 315 11" stroke="url(#lime)" stroke-width="13" stroke-linecap="round"/>
