<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-hidden="true">

  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272b30"/>
      <stop offset=".48" stop-color="#090b0e"/>
      <stop offset="1" stop-color="#010203"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ff62"/>
      <stop offset="1" stop-color="#bfff00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset="1" stop-color="#a66d16"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f0"/>
      <stop offset=".55" stop-color="#aeb5b0"/>
      <stop offset="1" stop-color="#5d6460"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#000" flood-opacity=".62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#cfff20" flood-opacity=".13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <ellipse cx="360" cy="359" rx="218" ry="64" fill="#11161a" stroke="#4b5356" stroke-width="6"/>
    <ellipse cx="360" cy="318" rx="192" ry="57" fill="url(#lime)" stroke="#f0ff6f" stroke-width="5"/>
    <ellipse cx="360" cy="276" rx="164" ry="50" fill="#101418" stroke="#cfff20" stroke-width="5"/>
    <ellipse cx="360" cy="238" rx="137" ry="43" fill="#d1a12b" stroke="#ffd978" stroke-width="5"/>
    <ellipse cx="360" cy="200" rx="110" ry="35" fill="#f1f3ee" stroke="#bcc3bd" stroke-width="5"/>
    <ellipse cx="360" cy="193" rx="54" ry="16" fill="#11161a"/>
  </g>
</svg>
